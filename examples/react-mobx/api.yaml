openapi: 3.1.0
info:
  title: Payments demo
  version: '1'
paths:
  /payments:
    post:
      operationId: createPayment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Money'
      responses:
        '201':
          description: Created payment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Money'
components:
  schemas:
    Money:
      type: object
      required: [amount, currency]
      additionalProperties: false
      properties:
        amount:
          type: number
          minimum: 0
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
