version: 1
mobx: false
validation: true
# region generator-job
generators:
  - package: client-features-example
    output: src/event-models
    options:
      events:
        PaymentCaptured: { paymentId: string, amount: number }
        PaymentRefunded: { paymentId: string, reason: string }
# endregion generator-job
# region openapi-dates-job
# region openapi-job
openapi:
  - input: api.yaml
    output: sdk
    name: Payments
# endregion openapi-job
    dates: temporal
# endregion openapi-dates-job
# region models-job
models:
  root: .
# endregion models-job
