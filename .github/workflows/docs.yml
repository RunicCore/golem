name: Verify and deploy docs

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Actions are pinned to release commits; the trailing comment names the tag.
jobs:
  # Release gate on the baseline runtime: build once, public source, OpenAPI
  # compliance, unit, packed-consumer, browser and React checks,
  # then the documentation site and a public-content scan of the built site.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # Newline-separated private terms; scan reports name only file and category.
      PUBLIC_CONTENT_DENIED_TEXT: ${{ secrets.PUBLIC_CONTENT_DENIED_TEXT }}
      # Pull requests from forks receive no secrets; every other run must have them.
      PUBLIC_CONTENT_REQUIRE_DENIED_TEXT: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && '1' || '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.15.0'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run release:check
      - run: npm run docs:check

  # Unit suites on the other supported runtimes and on Windows. The baseline
  # (ubuntu, Node 22.15.0) runs in `check`; packed and browser suites run there only.
  unit:
    name: unit (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    # Windows has not had a verified run yet; drop this once it is green.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22.15.0', '24']
        exclude:
          - os: ubuntu-latest
            node: '22.15.0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  deploy:
    if: github.event_name == 'workflow_dispatch'
    needs: [check, unit]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.15.0'
          cache: npm
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
        id: pages
      - run: npm ci
      - run: npx vitepress build docs
        env:
          DOCS_BASE: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: docs/.vitepress/dist
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
