# Stages the four golem packages on npm when a release tag (v*) is pushed; a maintainer approves each one on
# npmjs.com or with `npm stage approve` before it is public.
# npm trusts this workflow by OIDC (trusted publishing), so it needs no token and adds provenance.
name: Publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Check that the tag names the package version
        run: |
          for package in golem golem-model golem-openapi-ts golem-ts-openapi; do
            version=$(node -p "require('./packages/$package/package.json').version")
            if [ "$GITHUB_REF_NAME" != "v$version" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match $package $version; tag v$version, or set that version in the package files."
              exit 1
            fi
          done
      # package-lock.json is resolved on macOS and holds only that platform's native packages, so `npm ci` refuses it;
      # `npm install` keeps its pinned versions and adds the packages of this runner.
      - run: npm install --no-audit --no-fund
      - run: npm run build && npm run build:scripts
      - run: bash scripts/publish-packages.sh stage
