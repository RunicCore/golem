openapi: 3.1.0
info:
  title: VNPay QR-style fixture
  version: 1.0.0
servers:
  - url: https://fixture.invalid
security:
  - secureHash: []
paths:
  /payment/pay:
    post:
      operationId: createVnpayQrPayment
      summary: Create a QR payment
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PayRequest'
      responses:
        '200':
          description: Payment URL created
          content:
            application/json:
              schema:
                type: object
                required: [paymentUrl]
                properties:
                  paymentUrl:
                    type: string
                    format: uri
        '302':
          description: Redirect to payment
          headers:
            Location:
              required: true
              schema:
                type: string
                format: uri
  /payment/query:
    post:
      operationId: queryVnpayQrPayment
      summary: Query a QR payment
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [vnp_TxnRef]
              properties:
                vnp_TxnRef:
                  type: string
      responses:
        '200':
          description: Query result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryResult'
components:
  securitySchemes:
    secureHash:
      type: apiKey
      in: query
      name: vnp_SecureHash
  schemas:
    PayRequest:
      type: object
      required: [vnp_Amount, vnp_CurrCode, vnp_ReturnUrl, vnp_TxnRef]
      properties:
        vnp_Amount:
          type: integer
          minimum: 1
        vnp_CurrCode:
          type: string
          enum: [VND]
        vnp_ReturnUrl:
          type: string
          format: uri
        vnp_TxnRef:
          type: string
    QueryResult:
      type: object
      required: [vnp_TxnRef, vnp_ResponseCode]
      properties:
        vnp_TxnRef:
          type: string
        vnp_ResponseCode:
          type: string
          pattern: '^[0-9]{2}$'
