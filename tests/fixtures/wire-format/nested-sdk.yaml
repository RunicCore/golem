openapi: 3.1.0
info:
  title: Wire format nested SDK
  version: '1'
paths:
  /payments:
    post:
      operationId: createPayment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Payment'
      responses:
        '201':
          description: Created payment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
components:
  schemas:
    Merchant:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
          minLength: 2
    MerchantOmitId:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 2
    Payment:
      type: object
      additionalProperties: false
      required: [id, merchant, billing, paidAt]
      properties:
        id:
          type: string
        merchant:
          $ref: '#/components/schemas/Merchant'
        billing:
          $ref: '#/components/schemas/MerchantOmitId'
        paidAt:
          type: string
          format: date-time
        note:
          type: string
          maxLength: 140
